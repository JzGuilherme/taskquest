services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskcorp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure database/.env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - taskcorp_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  taskcorp_sqlserver_data:
