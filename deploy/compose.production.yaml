services:
  web:
    build: ../frontend
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIRECTORY:?Configure TLS_DIRECTORY}:/etc/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 172.30.0.2
  api:
    build: ../backend
    env_file: ./production.env
    secrets: [db_password, jwt_secret, redis_url]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [app]
secrets:
  db_password:
    file: ${SECRET_DIRECTORY:?Configure SECRET_DIRECTORY}/db_password
  jwt_secret:
    file: ${SECRET_DIRECTORY:?Configure SECRET_DIRECTORY}/jwt_secret
  redis_url:
    file: ${SECRET_DIRECTORY:?Configure SECRET_DIRECTORY}/redis_url
networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
