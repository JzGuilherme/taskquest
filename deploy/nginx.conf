limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
  listen 8080;
  server_name taskcorp.example.com;
  return 308 https://taskcorp.example.com$request_uri;
}
server {
  listen 8443 ssl;
  server_name taskcorp.example.com;
  ssl_certificate /etc/tls/fullchain.pem;
  ssl_certificate_key /etc/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  client_body_timeout 10s;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
    limit_conn connections 20;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID "";
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
